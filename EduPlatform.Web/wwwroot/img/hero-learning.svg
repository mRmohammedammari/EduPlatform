<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Illustration d'un parcours d'apprentissage">
  <title>Parcours d'apprentissage</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#eef2ff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>

  <circle cx="1010" cy="150" r="190" fill="#ffffff" opacity="0.08"/>
  <circle cx="170" cy="660" r="230" fill="#ffffff" opacity="0.06"/>

  <!-- Fenetre de cours -->
  <g transform="translate(180 170)">
    <rect width="600" height="380" rx="26" fill="url(#card)"/>
    <rect x="0" y="0" width="600" height="58" rx="26" fill="#1f2937" opacity="0.9"/>
    <rect x="0" y="40" width="600" height="18" fill="#1f2937" opacity="0.9"/>
    <circle cx="34" cy="29" r="7" fill="#f87171"/>
    <circle cx="58" cy="29" r="7" fill="#fbbf24"/>
    <circle cx="82" cy="29" r="7" fill="#34d399"/>

    <!-- Lecteur video -->
    <rect x="34" y="92" width="340" height="196" rx="14" fill="#312e81"/>
    <polygon points="186,160 186,220 238,190" fill="#ffffff" opacity="0.95"/>
    <rect x="34" y="300" width="340" height="10" rx="5" fill="#c7d2fe"/>
    <rect x="34" y="300" width="214" height="10" rx="5" fill="url(#accent)"/>

    <!-- Liste de modules -->
    <g transform="translate(404 92)">
      <rect width="162" height="30" rx="8" fill="#e0e7ff"/>
      <rect y="44" width="162" height="30" rx="8" fill="#e0e7ff"/>
      <rect y="88" width="162" height="30" rx="8" fill="#e0e7ff"/>
      <rect y="132" width="162" height="30" rx="8" fill="#e0e7ff"/>
      <circle cx="16" cy="15" r="7" fill="#34d399"/>
      <circle cx="16" cy="59" r="7" fill="#34d399"/>
      <circle cx="16" cy="103" r="7" fill="#6366f1"/>
      <circle cx="16" cy="147" r="7" fill="#c7d2fe"/>
      <rect x="34" y="8" width="104" height="14" rx="7" fill="#a5b4fc"/>
      <rect x="34" y="52" width="88" height="14" rx="7" fill="#a5b4fc"/>
      <rect x="34" y="96" width="112" height="14" rx="7" fill="#a5b4fc"/>
      <rect x="34" y="140" width="76" height="14" rx="7" fill="#c7d2fe"/>
    </g>

    <rect x="34" y="332" width="220" height="16" rx="8" fill="#c7d2fe"/>
  </g>

  <!-- Carte de progression -->
  <g transform="translate(690 430)">
    <rect width="300" height="200" rx="24" fill="url(#card)"/>
    <rect x="28" y="34" width="120" height="14" rx="7" fill="#a5b4fc"/>
    <text x="28" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" fill="#4f46e5">78%</text>
    <rect x="28" y="132" width="244" height="12" rx="6" fill="#e0e7ff"/>
    <rect x="28" y="132" width="190" height="12" rx="6" fill="url(#accent)"/>
    <rect x="28" y="162" width="160" height="12" rx="6" fill="#c7d2fe"/>
  </g>

  <!-- Badge -->
  <g transform="translate(830 210)">
    <circle r="56" fill="#fbbf24"/>
    <circle r="40" fill="#fde68a"/>
    <polygon points="0,-24 7,-8 24,-8 10,3 15,20 0,10 -15,20 -10,3 -24,-8 -7,-8" fill="#b45309"/>
  </g>
</svg>
